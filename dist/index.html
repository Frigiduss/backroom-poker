<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back Room Poker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&display=swap">
<style>/* Layout: a single card-room screen. Setup is a menu card on the felt; play is an oval table
   with seats on an ellipse, the board in the middle and the action bar along the bottom edge.
   One deliberate dark look (green baize, walnut rail, ivory cards, brass trim). */
:root {
  --room: #0b1511;
  --felt: #145a3e;
  --felt-deep: #0b3a28;
  --felt-line: rgba(232, 214, 160, 0.18);
  --rail: #3a2416;
  --rail-hi: #5a3a24;
  --ivory: #f7f2e6;
  --ivory-edge: #d9d0bb;
  --ink: #17130f;
  --brass: #d9a94e;
  --brass-deep: #9c7428;
  --text: #edf2ec;
  --muted: #a3b9ac;
  --faint: #6f8a7c;
  --panel: #13221b;
  --panel-2: #1a2e24;
  --line: #2a4236;
  --suit-red: #c42f3a;
  --suit-black: #17130f;
  --suit-blue: #2257b8;
  --suit-green: #217a3c;
  --good: #6fd08c;
  --warn: #f0b653;
  --bad: #ef6a5e;
  --back-a: #7a1f2b;
  --back-b: #5a141d;

  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --body: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --label: 'Barlow Condensed', 'Arial Narrow', 'Barlow', sans-serif;

  --cw: clamp(30px, 3.6vw, 52px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--room);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}

/* ---------- Setup ---------- */
.setup {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  display: grid;
  gap: 22px;
  padding-block: 12px 32px;
}
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(30px, 5vw, 48px);
  margin: 0;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.brand h1 .pip { color: var(--suit-red); }
.brand p { margin: 0; color: var(--muted); max-width: 52ch; }
.section-label {
  font-family: var(--label);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-size: 13px;
  color: var(--brass);
  margin: 0 0 10px;
}
.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.game-tile {
  text-align: left;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, var(--panel-2), var(--panel));
  border-radius: 10px;
  padding: 14px 14px 12px;
  display: grid;
  gap: 6px;
  min-width: 0;
  transition: border-color .15s, transform .15s;
}
.game-tile:hover { border-color: var(--faint); }
.game-tile[aria-pressed="true"] {
  border-color: var(--brass);
  background: linear-gradient(160deg, #22382c, #172a20);
  box-shadow: inset 0 0 0 1px var(--brass);
}
.game-tile .name { font-family: var(--display); font-size: 20px; font-weight: 700; }
.game-tile .blurb { color: var(--muted); font-size: 13.5px; }
.game-tile .meta { font-family: var(--label); letter-spacing: 0.06em; text-transform: uppercase; font-size: 12px; color: var(--faint); }

.options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px 22px;
  border-top: 1px solid var(--line);
  padding-top: 20px;
}
.field { display: grid; gap: 8px; min-width: 0; align-content: start; }
.field > label, .field > .flabel {
  font-family: var(--label); text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px; color: var(--muted);
}
.field .hint { color: var(--faint); font-size: 13px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 14px;
}
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 600; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.text-input, select.text-input {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  width: 100%;
}
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row input[type="range"] { flex: 1; accent-color: var(--brass); min-width: 0; }
.range-row output { font-variant-numeric: tabular-nums; min-width: 2ch; font-weight: 600; }
.cta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line);
  background: var(--panel-2);
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 600;
}
.btn:hover { border-color: var(--faint); }
.btn-primary {
  background: linear-gradient(180deg, #e7bb62, var(--brass));
  color: var(--ink);
  border-color: var(--brass-deep);
  font-size: 17px;
  padding: 12px 26px;
}
.btn-primary:hover { border-color: var(--ink); }
.summary-line { color: var(--muted); }

/* ---------- Game screen ---------- */
.game {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px 14px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  min-height: 0;
}
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 10px 18px;
  flex-wrap: wrap;
}
.topbar .title { font-family: var(--display); font-weight: 700; font-size: 20px; }
.chip-info {
  font-family: var(--label);
  letter-spacing: 0.05em;
  font-size: 14px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.chip-info b { color: var(--text); font-weight: 600; }
.topbar .spacer { flex: 1; }
.icon-btn {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 11px;
  font-size: 14px;
}

.table-wrap { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; }
.table {
  position: relative;
  width: 100%;
  max-width: 1000px;
  aspect-ratio: 16 / 9.4;
  max-height: calc(100vh - 230px);
  min-height: 300px;
}
.felt {
  position: absolute;
  inset: 9% 7%;
  border-radius: 999px;
  background:
    radial-gradient(ellipse at 50% 42%, #1d7a54 0%, var(--felt) 45%, var(--felt-deep) 100%);
  box-shadow:
    0 0 0 12px var(--rail),
    0 0 0 14px var(--rail-hi),
    0 0 0 15px #1c1009,
    0 22px 50px rgba(0, 0, 0, .55),
    inset 0 0 60px rgba(0, 0, 0, .45);
}
.felt::after {
  content: '';
  position: absolute;
  inset: 7%;
  border-radius: 999px;
  border: 1px solid var(--felt-line);
}
.felt-mark {
  position: absolute;
  left: 50%; top: 69%;
  transform: translate(-50%, -50%);
  font-family: var(--display);
  font-size: clamp(12px, 1.6vw, 18px);
  color: rgba(232, 214, 160, 0.22);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
  pointer-events: none;
}
.center {
  position: absolute;
  left: 50%; top: 45%;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 8px;
  width: 60%;
}
.board { display: flex; gap: 6px; min-height: calc(var(--cw) * 1.4); }
.pot {
  font-family: var(--label);
  letter-spacing: 0.06em;
  background: rgba(0, 0, 0, .35);
  padding: 3px 12px;
  border-radius: 999px;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
}
.pot b { color: var(--brass); font-weight: 600; }

/* Cards */
.card {
  width: var(--cw);
  height: calc(var(--cw) * 1.4);
  border-radius: calc(var(--cw) * 0.1);
  background: var(--ivory);
  border: 1px solid var(--ivory-edge);
  box-shadow: 0 2px 4px rgba(0, 0, 0, .35);
  position: relative;
  flex: none;
  color: var(--suit-black);
  font-family: var(--display);
  user-select: none;
}
.card .r {
  position: absolute; left: 9%; top: 3%;
  font-weight: 700;
  font-size: calc(var(--cw) * 0.42);
  line-height: 1;
}
.card .s1 { position: absolute; left: 10%; top: 34%; font-size: calc(var(--cw) * 0.3); line-height: 1; }
.card .s2 { position: absolute; right: 8%; bottom: 4%; font-size: calc(var(--cw) * 0.6); line-height: 1; }
.card.red { color: var(--suit-red); }
.four-color .card.d { color: var(--suit-blue); }
.four-color .card.c { color: var(--suit-green); }
.card.back {
  background:
    repeating-linear-gradient(45deg, var(--back-a) 0 4px, var(--back-b) 4px 8px);
  border: 2px solid var(--ivory);
}
.card.back::after {
  content: '';
  position: absolute; inset: 12%;
  border: 1px solid rgba(247, 242, 230, .45);
  border-radius: 3px;
}
.card.hole-own { box-shadow: 0 2px 4px rgba(0, 0, 0, .35), inset 0 -4px 0 rgba(23, 19, 15, 0.12); }
.card.hole-own::before {
  content: '';
  position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%);
  width: 40%; height: 3px; border-radius: 2px; background: var(--faint);
}
.card.win { box-shadow: 0 0 0 2px var(--brass), 0 0 14px rgba(217, 169, 78, .7); }
.card.selected { transform: translateY(-22%); box-shadow: 0 0 0 2px var(--bad), 0 6px 10px rgba(0,0,0,.4); }
.card.selected::after {
  content: '✕'; position: absolute; left: 4px; top: -9px;
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--bad); color: var(--ink); font-family: var(--body); font-size: 11px; font-weight: 700;
}
.card.pickable { cursor: pointer; transition: transform .12s; }
.card.empty { background: rgba(0, 0, 0, .18); border: 1px dashed var(--felt-line); box-shadow: none; }
.deal { animation: deal .32s ease-out both; }
@keyframes deal { from { opacity: 0; transform: translateY(-14px) scale(.9); } }

/* Seats */
.seat {
  position: absolute;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 4px;
  width: max-content;
  max-width: 34%;
  z-index: 2;
}
.seat .cards { display: flex; }
.seat .cards .card + .card { margin-left: calc(var(--cw) * -0.42); }
.seat.many .cards .card + .card { margin-left: calc(var(--cw) * -0.58); }
.seat.me .cards .card + .card { margin-left: calc(var(--cw) * -0.18); }
.seat.me.many .cards .card + .card { margin-left: calc(var(--cw) * -0.3); }
.seat .cards .card.upcard { transform: translateY(-14%); }
.plate {
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #1f1712, #120c08);
  border: 1px solid #4a3324;
  border-radius: 999px;
  padding: 4px 12px 4px 4px;
  min-width: 128px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .4);
}
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--label); font-weight: 600; font-size: 14px;
  color: var(--ink);
  flex: none;
}
.plate .who { display: grid; line-height: 1.15; min-width: 0; }
.plate .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.plate .stk { font-variant-numeric: tabular-nums; color: var(--brass); font-weight: 600; font-size: 14px; }
.plate .tag { font-family: var(--label); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.seat.acting .plate { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(217, 169, 78, .5), 0 0 18px rgba(217, 169, 78, .35); }
.seat.acting .avatar { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(217, 169, 78, .3); } }
.seat.folded { opacity: .45; }
.seat.busted { opacity: .3; }
.seat.winner .plate { border-color: var(--good); box-shadow: 0 0 0 2px rgba(111, 208, 140, .45), 0 0 18px rgba(111, 208, 140, .35); }
.bubble {
  font-family: var(--label);
  font-size: 13px;
  letter-spacing: .04em;
  background: rgba(0, 0, 0, .55);
  color: var(--text);
  padding: 1px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.bubble.allin { background: var(--bad); color: var(--ink); font-weight: 600; }
.bubble.handname { background: var(--ivory); color: var(--ink); }
.bet {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 5px;
  font-variant-numeric: tabular-nums;
  font-weight: 600; font-size: 14px;
  z-index: 1;
}
.chip {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle, var(--ivory) 0 30%, var(--suit-red) 31% 62%, var(--ivory) 63% 70%, var(--suit-red) 71%);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .5);
}
.dealer {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--ivory); color: var(--ink);
  display: grid; place-items: center;
  font-family: var(--label); font-weight: 600; font-size: 13px;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
  z-index: 1;
}

/* Result banner on the felt */
.result {
  position: absolute;
  left: 50%; top: 68%;
  transform: translate(-50%, -50%);
  background: rgba(10, 20, 15, .92);
  border: 1px solid var(--brass-deep);
  border-radius: 12px;
  padding: 14px 18px;
  display: grid; gap: 8px;
  max-width: min(92%, 460px);
  z-index: 5;
  box-shadow: 0 16px 40px rgba(0, 0, 0, .6);
  text-align: center;
}
.result .lines { display: grid; gap: 3px; }
.result .lines div:first-child { font-family: var(--display); font-size: 18px; font-weight: 700; }
.result .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

/* Action bar */
.actionbar {
  grid-column: 1;
  display: flex;
  align-items: center;
  gap: 10px 14px;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  min-height: 64px;
}
.actionbar .status { color: var(--muted); flex: 1; min-width: 160px; }
.actionbar .status b { color: var(--text); }
.myhand { display: grid; gap: 1px; min-width: 0; }
.myhand .hn { font-family: var(--display); font-weight: 700; font-size: 17px; }
.myhand .odds { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.act {
  border-radius: 9px;
  padding: 11px 18px;
  font-weight: 700;
  font-size: 15px;
  border: 1px solid transparent;
  min-width: 92px;
  font-variant-numeric: tabular-nums;
}
.act.fold { background: #3a1e1c; border-color: #6b302b; color: #ffd9d4; }
.act.call { background: #1e3a2b; border-color: #2f6b4b; color: #d8ffe6; }
.act.raise { background: linear-gradient(180deg, #e7bb62, var(--brass)); color: var(--ink); border-color: var(--brass-deep); }
.act:disabled { opacity: .4; cursor: not-allowed; }
.act kbd { font-family: var(--label); font-size: 11px; opacity: .6; margin-left: 6px; font-weight: 500; }
.sizer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sizer input[type="range"] { width: 160px; accent-color: var(--brass); }
.sizer input[type="number"] {
  width: 90px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px; font-variant-numeric: tabular-nums;
}
.preset {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-size: 13px;
}

/* Log */
.log {
  grid-column: 2;
  grid-row: 2 / 4;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  max-height: calc(100vh - 90px);
  align-self: start;
  height: 100%;
}
.log h2 {
  margin: 0;
  padding: 10px 12px;
  font-family: var(--label); text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--brass);
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
.log ol { list-style: none; margin: 0; padding: 8px 12px 12px; overflow-y: auto; flex: 1; display: grid; gap: 3px; align-content: start; font-size: 13.5px; }
.log li { color: var(--muted); overflow-wrap: anywhere; }
.log li.k-street { color: var(--text); font-weight: 600; margin-top: 4px; }
.log li.k-start { color: var(--brass); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
.log li.k-win { color: var(--good); }
.log li.me { color: var(--text); }

/* Modals */
.overlay {
  position: fixed; inset: 0;
  background: rgba(4, 9, 7, .72);
  display: grid; place-items: center;
  z-index: 20;
  padding: 16px;
}
.modal {
  width: min(520px, 100%);
  max-height: 100%;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--brass-deep);
  border-radius: 14px;
  padding: 20px;
  display: grid;
  gap: 14px;
}
.modal h2 { margin: 0; font-family: var(--display); font-size: 26px; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.standings { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.standings td, .standings th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.standings th { font-family: var(--label); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--muted); font-weight: 500; }
.standings tr.me td { color: var(--brass); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; }
.toggle input { accent-color: var(--brass); width: 18px; height: 18px; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.log-toggle { display: none; }

@media (max-width: 900px) {
  .game { grid-template-columns: minmax(0, 1fr); }
  .log { grid-column: 1; grid-row: auto; max-height: 260px; height: auto; }
  .log.collapsed ol { display: none; }
  .log-toggle { display: inline-block; }
}
@media (max-width: 640px) {
  :root { --cw: clamp(24px, 7vw, 36px); }
  .topbar .title { font-size: 17px; }
  .topbar .spacer { display: none; }
  .table { aspect-ratio: 3 / 4; max-height: none; min-height: 0; }
  .felt { inset: 7% 10%; }
  .center { width: 74%; }
  .plate { min-width: 0; padding: 3px 8px 3px 3px; gap: 5px; }
  .avatar { width: 24px; height: 24px; font-size: 12px; }
  .plate .nm { font-size: 12px; max-width: 64px; }
  .plate .stk { font-size: 12px; }
  .plate .tag { display: none; }
  .bubble { font-size: 11px; }
  .act { min-width: 0; padding: 10px 12px; flex: 1; }
  .acts { width: 100%; }
  .sizer { width: 100%; }
  .sizer input[type="range"] { flex: 1; width: auto; min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .deal, .seat.acting .avatar { animation: none; }
  .card.pickable { transition: none; }
}
</style>
</head>
