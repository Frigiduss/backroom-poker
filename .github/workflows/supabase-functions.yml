# Builds the online table server (supabase/functions/poker-table, bundled from src/online and
# the engine, bots and accounts code it uses) and deploys it to Supabase whenever that code
# changes on main. One-time setup: add a repository secret named SUPABASE_ACCESS_TOKEN
# (see supabase/README.md). Without it this workflow skips the deploy.
name: Deploy table server to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'src/online/**'
      - 'src/engine/**'
      - 'src/bots/**'
      - 'src/accounts/**'
      - 'scripts/build.mjs'
      - 'package-lock.json'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip when no access token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::notice::Add the SUPABASE_ACCESS_TOKEN secret to deploy the table server (see supabase/README.md)."
      - uses: actions/setup-node@v7
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci --no-audit --no-fund && npm run build
      # Pinned: "latest" made setup-cli look up GitHub releases, which hit API rate limits.
      # v3 installs the CLI from npm. Bump this when a newer CLI is needed.
      - uses: supabase/setup-cli@v3
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.121.0
      - name: Deploy poker-table
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy poker-table --project-ref yqvizfunfdxtlozvtqfs --no-verify-jwt --use-api
