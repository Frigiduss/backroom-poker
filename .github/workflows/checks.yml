# Runs on every pull request so broken code can't slip in:
# type check, a build, and the test suite. Build output (dist/ and the bundled table server)
# isn't committed; the deploy workflows build it themselves.
# To make this required before merging, see "Required checks" in README.md.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the older run, which saves Actions minutes.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
